<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASLPredictor AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #b8c3c7, #e2e6e8);
      color: #222;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
      transition: background 0.5s ease, color 0.5s ease;
    }

    .container {
      max-width: 500px;
      min-height: 60vh;
      margin: auto;
      padding: 30px;
      background: #f6f0f0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border-radius: 16px;
    }

    h2 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 10px;
    }

    .mode-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .mode-select button {
      padding: 10px 20px;
      font-weight: 600;
      background-color: #e2e6e8;
      color: #111827;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .mode-select button.active {
      background-color: #4f78fe;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    #webcamContainer
    {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    #uploadContainer {
      border: 2px dashed #999;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    video, canvas, img.preview {
      width: 300px;
      height: 250px;
      border-radius: 12px;
      border: 2px solid #d1d5db;
      object-fit: cover;
    }

    input[type="file"] {
      margin-top: 10px;
      padding: 8px;
    }

    #prediction {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: 600;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      background: #e2e6e8;
      color: #0369a1;
    }

    button.action {
      background-color: #4f78fe;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    #uploadContainer.dragover {
      background-color: #dbeafe; /* subtle highlight on drag */
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      video, canvas, img.preview {
        width: 100% !important;
        height: auto;
      }

      .container {
        padding: 15px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ASLPredictor AI</h2>
    <p style="text-align:center; color: #6b7280;">Choose input mode to detect ASL hand signs</p>

    <div class="mode-select">
      <button id="webcamModeBtn">Webcam</button>
      <button id="uploadModeBtn">Upload</button>
    </div>

    <!-- Webcam -->
    <div id="webcamContainer">
      <div style="position: relative; display: inline-block;">
        <video id="video" autoplay playsinline style="transform: scaleX(-1);"></video>
        <!-- ROI Overlay Box -->
        <div style="
          position: absolute;
          top: 25px;
          left: 25px;
          width: 250px;
          height: 200px;
          border: 2px dashed red;
          pointer-events: none;
          z-index: 2;">
        </div>
      </div>
      
      <canvas id="canvas" width="64" height="64" style="display:none;"></canvas>
      <button class="action" onclick="captureAndPredict()">Capture & Predict</button>
      <img id="capturedPreview" class="preview" style="display:none;" />
    </div>

    <!-- Upload -->
    <div id="uploadContainer">
      <div style="position: relative; display: inline-block;">
        <input type="file" id="uploadInput" accept="image/*" />
        <img id="uploadPreview" class="preview" style="display:none;" />
      </div>
      <canvas id="canvas" width="64" height="64" style="display:none;"></canvas>
      <br>
      <button class="action" onclick="predictUploadedImage()">Predict</button>
      <br>
    </div>

    <!-- Prediction -->
    <div id="prediction"></div>
  </div>

  <script>
    const webcamBtn = document.getElementById('webcamModeBtn');
    const uploadBtn = document.getElementById('uploadModeBtn');
    const webcamContainer = document.getElementById('webcamContainer');
    const uploadContainer = document.getElementById('uploadContainer');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const predictionBox = document.getElementById('prediction');
    const uploadInput = document.getElementById('uploadInput');
    const uploadPreview = document.getElementById('uploadPreview');

    let currentMode = null;

    // Handle mode switching
    webcamBtn.onclick = () => {
      setMode('webcam');
    };

    uploadBtn.onclick = () => {
      setMode('upload');
    };

    function setMode(mode) {
      if (mode === 'webcam') {
        webcamBtn.classList.add('active');
        uploadBtn.classList.remove('active');
        webcamContainer.style.display = 'flex';
        uploadContainer.style.display = 'none';
        currentMode = 'webcam';
        startWebcam();
      } else {
        uploadBtn.classList.add('active');
        webcamBtn.classList.remove('active');
        webcamContainer.style.display = 'none';
        uploadContainer.style.display = 'flex';
        currentMode = 'upload';
        stopWebcam();
      }
      predictionBox.innerText = '';
    }

    function startWebcam() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream)
        .catch(() => alert("Webcam access denied or not available."));
    }

    function stopWebcam() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    // Webcam predict
    async function captureAndPredict() {
      // Mirror-correct the captured frame
      ctx.save();                              // Save canvas state
      ctx.translate(canvas.width, 0);         // Move to right edge
      ctx.scale(-1, 1);                        // Flip horizontally
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();                           // Restore canvas state

      // Show captured preview
      const dataURL = canvas.toDataURL('image/jpeg');
      document.getElementById('capturedPreview').src = dataURL;
      document.getElementById('capturedPreview').style.display = 'block';

      // Send image to server
      canvas.toBlob(async blob => {
          const formData = new FormData();
          formData.append('image', blob, 'webcam.jpg');

          const res = await fetch('/predict', { method: 'POST', body: formData });
          const data = await res.json();

          showPrediction(data);
      }, 'image/jpeg');
    }

    // Upload predict
    async function predictUploadedImage() {
      const file = uploadInput.files[0];
      if (!file) return alert("Please select an image first");

      const formData = new FormData();
      formData.append('image', file);

      const res = await fetch('/predict', { method: 'POST', body: formData });
      const data = await res.json();

      showPrediction(data);
    }

    // Show image preview
    uploadInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        uploadPreview.src = URL.createObjectURL(file);
        uploadPreview.style.display = 'block';
      } else {
        uploadPreview.style.display = 'none';
      }
    };

    // Show and speak prediction
    async function showPrediction(data) {
      predictionBox.innerText = `Prediction: ${data.label} (Confidence: ${(data.confidence * 100).toFixed(2)}%)`;
      const speakRes = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: data.label })
      });
      const speakData = await speakRes.json();
      new Audio(`/sounds/${speakData.filename}`).play();
    }

    // Default to webcam mode
    window.onload = () => setMode('webcam');

    // --- Drag & Drop support for uploadContainer ---
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      uploadContainer.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
      });
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadContainer.addEventListener(eventName, () => uploadContainer.classList.add('dragover'));
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadContainer.addEventListener(eventName, () => uploadContainer.classList.remove('dragover'));
    });

    uploadContainer.addEventListener('drop', e => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        if (!file.type.startsWith('image/')) {
          alert("Please drop a valid image file.");
          return;
        }
        // Update file input to reflect dropped file
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        uploadInput.files = dataTransfer.files;

        // Show preview
        uploadPreview.src = URL.createObjectURL(file);
        uploadPreview.style.display = 'block';
      }
    });
  </script>
</body>
</html>
